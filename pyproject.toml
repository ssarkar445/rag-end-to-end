[project]
name = "rag-end-to-end"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "langchain>=1.3.17",
    "langchain-anthropic>=1.6.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.6.0",
    "langchain-postgres>=0.0.17",
    "langgraph>=1.2.11",
    "ollama>=0.6.2",
    "psycopg2>=2.9.12",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
]

[project.scripts]
rag-end-to-end = "rag_end_to_end:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
